name: CI/CD EasyRealEstate Garda Lake

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and push backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile.prod
        push: false # Do not push for CI, only build
        tags: easyrealestate-backend:latest

    - name: Build and push frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.prod
        push: false # Do not push for CI, only build
        tags: easyrealestate-frontend:latest

    - name: Install Node.js for frontend tests
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install pnpm for frontend
      run: npm install -g pnpm

    - name: Install frontend dependencies
      run: pnpm install
      working-directory: ./frontend

    - name: Run frontend unit tests (Jest skeleton)
      run: echo "Running Jest unit tests... (placeholder)"
      working-directory: ./frontend
      # In a real project, this would be: run: pnpm test

    - name: Set up Python for backend tests
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install backend dependencies
      run: pip install -r requirements.txt
      working-directory: ./backend

    - name: Run backend unit tests (Pytest skeleton)
      run: echo "Running Pytest unit tests... (placeholder)"
      working-directory: ./backend
      # In a real project, this would be: run: pytest

    - name: Start Docker Compose services for E2E and Lighthouse
      run: docker-compose -f docker-compose.prod.yml up -d
      working-directory: .

    - name: Wait for services to be ready
      run: | 
        echo "Waiting for frontend to be ready..."
        timeout 120 bash -c 'until curl -s http://localhost:3000 > /dev/null; do echo -n "."; sleep 5; done'
        echo "Frontend is ready!"
        echo "Waiting for backend to be ready..."
        timeout 120 bash -c 'until curl -s http://localhost:8000/api/metrics/visitors > /dev/null; do echo -n "."; sleep 5; done'
        echo "Backend is ready!"

    - name: Run Cypress E2E tests
      uses: cypress-io/github-action@v5
      with:
        working-directory: frontend
        start: pnpm run dev --host # This should be adjusted to point to the dockerized frontend
        wait-on: 'http://localhost:3000'
        # For dockerized setup, start command might not be needed if services are already up
        # and baseUrl in cypress.config.js points to the correct service.
        # We'll rely on the docker-compose up and wait-on for now.

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        urls: |
          http://localhost:3000/
          http://localhost:3000/properties
        uploadArtifacts: true
        temporaryPublicStorage: true

    - name: Stop Docker Compose services
      if: always()
      run: docker-compose -f docker-compose.prod.yml down
      working-directory: .


